<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator - Aurora Studio</title>
  <!-- JSPDF Library for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Dark Theme Variables (Default) */
    :root {
      --glass-bg: rgba(22, 16, 36, 0.55);
      --glass-filter: blur(22px);
      --glass-border: rgba(255, 255, 255, 0.12);
      --inner-box-bg: rgba(10, 6, 20, 0.65);
      --inner-box-border: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(0, 0, 0, 0.25);
      --card-footer-bg: rgba(6, 4, 12, 0.85);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.75);
      --title-gradient: linear-gradient(135deg, #c084fc, #e879f9);
      --btn-secondary-bg: rgba(12, 8, 24, 0.5);
      --btn-secondary-border: rgba(255, 255, 255, 0.18);
      --bg-overlay: rgba(10, 4, 25, 0.18);
      --select-bg: rgba(24, 12, 42, 0.85);
      --select-border: rgba(168, 85, 247, 0.35);
      --option-bg: #24113d;
    }

    /* Light Theme Overrides */
    [data-theme="light"] {
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-filter: blur(30px) brightness(1.2);
      --glass-border: rgba(255, 255, 255, 0.8);
      --inner-box-bg: rgba(243, 232, 255, 0.85);
      --inner-box-border: rgba(168, 85, 247, 0.25);
      --card-bg: rgba(255, 255, 255, 0.5);
      --card-footer-bg: rgba(255, 255, 255, 0.95);
      --text-main: #2e1065;
      --text-muted: #6b21a8;
      --title-gradient: linear-gradient(135deg, #7e22ce, #c026d3);
      --btn-secondary-bg: rgba(255, 255, 255, 0.85);
      --btn-secondary-border: rgba(168, 85, 247, 0.3);
      --bg-overlay: rgba(255, 255, 255, 0.12);
      --select-bg: rgba(243, 232, 255, 0.95);
      --select-border: rgba(168, 85, 247, 0.5);
      --option-bg: #f3e8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background 0.3s, color 0.3s, border-color 0.3s, backdrop-filter 0.3s;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("Image/Twilight Cherry Blossom Mountain Lake.png") no-repeat center center fixed;
      background-size: cover;
      padding: 1rem;
      position: relative;
    }

    /* Background Overlay for Readability */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      z-index: -1;
      pointer-events: none;
    }

    /* Glassmorphism Panel Container */
    .glass-container {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-filter);
      -webkit-backdrop-filter: var(--glass-filter);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 1.75rem 2.25rem;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35),
                  0 0 30px rgba(168, 85, 247, 0.2);
      position: relative;
    }

    /* Top Navigation Header Layout */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
      position: relative;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 0.5rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .export-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 2;
    }

    .export-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-title span {
      background: var(--title-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    /* Action Controls Bar - Desktop Single Line Layout */
    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      flex-wrap: nowrap;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.4rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
      white-space: nowrap;
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--btn-secondary-border);
      padding: 0.6rem 1.2rem;
      font-size: 0.88rem;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .favorite-btn.saved {
      color: #ec4899;
      border-color: rgba(236, 72, 153, 0.5);
    }

    /* Custom Purple Styled Dropdowns */
    .format-select, .palette-style-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;

      background: var(--select-bg);
      color: var(--text-main);

      border: 1px solid var(--select-border);

      height: 38px;
      font-size: 0.85rem;
      font-weight: 600;

      border-radius: 10px;
      cursor: pointer;
      outline: none;

      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c084fc' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.55rem center;
      background-size: 0.8em;
    }

    .format-select {
      width: 105px;
      min-width: 105px;
      max-width: 105px;
      padding: 0.6rem 1.8rem 0.6rem 0.8rem;
    }

    .palette-style-select {
      width: 185px;
      min-width: 185px;
      max-width: 185px;
      padding: 0.6rem 1.8rem 0.6rem 0.8rem;
    }

    .format-select option, .palette-style-select option {
      background: var(--option-bg);
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .secondary-controls-group {
      display: flex;
      gap: 0.65rem;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
    }

    /* Color Swatches Grid */
    .palette-box {
      background: var(--inner-box-bg);
      border: 1px solid var(--inner-box-border);
      border-radius: 16px;
      padding: 1.15rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .color-card {
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--inner-box-border);
      transition: transform 0.2s;
    }

    .color-card:hover {
      transform: translateY(-2px);
    }

    .color-card.full-width-mobile {
      grid-column: span 1;
    }

    .color-display {
      height: 140px;
      width: 100%;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
    }

    .lock-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      border: none;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.85;
    }

    .lock-indicator:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.7);
    }

    .color-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.6rem;
      background: var(--card-footer-bg);
      border-radius: 0 0 12px 12px;
    }

    .color-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .color-name {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .hex-text {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-main);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .copy-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.15rem;
    }

    .copy-icon-btn:hover {
      color: var(--text-main);
    }

    /* Footer Note Layout */
    .footer-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .copyright {
      opacity: 0.85;
      font-size: 0.72rem;
      margin-top: 0.15rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(168, 85, 247, 0.95);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 0.6rem 1.4rem;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Tablet Breakpoint */
    @media (max-width: 768px) {
      .palette-box {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Mobile Breakpoint Refinements */
    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        overflow-y: auto;
        padding: 0.75rem 0.5rem;
      }

      .glass-container {
        padding: 1.25rem 0.85rem 1.75rem;
        margin: 0.25rem 0 1.5rem 0;
        border-radius: 20px;
        min-height: auto;
      }

      .top-bar {
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }

      .header-title {
        order: 3;
        width: 100%;
        margin-top: 0.75rem;
        font-size: 1.5rem;
      }

      .subtitle {
        font-size: 0.8rem;
        margin-bottom: 1.15rem;
      }

      /* Single Horizontal Row for Mobile Controls */
      .controls-bar {
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: flex-start;
        align-items: center;
        width: 100%;
        gap: 0.4rem;
        overflow-x: auto;
        padding-bottom: 0.4rem;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none; /* Hide scrollbar for clean UI */
      }

      .controls-bar::-webkit-scrollbar {
        display: none;
      }

      .btn-primary {
        flex: 0 0 auto;
        min-height: 38px;
        padding: 0.55rem 0.7rem;
        font-size: 0.76rem;
      }

      /* Reduced Select Sizes for Mobile Single Line */
      .palette-style-select {
        flex: 0 0 135px;
        width: 135px;
        min-width: 135px;
        max-width: 135px;
        height: 38px;
        padding: 0.55rem 1.4rem 0.55rem 0.55rem;
        font-size: 0.74rem;
        border-radius: 10px;
      }

      .secondary-controls-group {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: nowrap;
        gap: 0.4rem;
      }

      .secondary-controls-group .btn-secondary {
        flex: 0 0 auto;
        padding: 0.55rem 0.6rem;
        font-size: 0.74rem;
        white-space: nowrap;
      }

      .format-select {
        flex: 0 0 58px;
        width: 58px;
        min-width: 58px;
        max-width: 58px;
        height: 38px;
        padding: 0.55rem 1.1rem 0.55rem 0.4rem;
        font-size: 0.72rem;
      }

      .palette-box {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        padding: 0.75rem;
      }

      .color-card.full-width-mobile {
        grid-column: span 2;
      }

      .color-display {
        height: 105px;
      }

      .color-footer {
        padding: 0.55rem 0.55rem;
      }

      .footer-note {
        flex-direction: column;
        line-height: 1.5;
        font-size: 0.72rem;
        padding: 0.25rem 0.25rem 0.5rem;
        margin-top: 0.5rem;
        gap: 0.2rem;
      }

      .footer-note b {
        white-space: nowrap;
      }

      .copyright {
        display: block;
        opacity: 0.85;
        font-size: 0.72rem;
        margin-top: 0.15rem;
        padding-bottom: 0.5rem;
      }
    }

    /* Small Screen Specific Adjustments */
    @media (max-width: 380px) {
      .header-title {
        font-size: 1.35rem;
        gap: 0.35rem;
      }

      .palette-style-select {
        font-size: 0.70rem;
      }

      .secondary-controls-group .btn-secondary {
        font-size: 0.72rem;
        padding-left: 0.4rem;
        padding-right: 0.4rem;
      }

      .format-select {
        font-size: 0.70rem;
      }
    }
  </style>
</head>
<body>

  <div class="glass-container">
    
    <!-- Top Header -->
    <div class="top-bar">
      <button class="icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>

      <div class="header-title">

      <button class="export-btn" onclick="exportPDF()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
    </div>

    <div class="subtitle">Generate beautiful color palettes for your next project</div>

    <!-- Action Controls -->
    <div class="controls-bar">
      <button class="btn-primary" onclick="generatePalette()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Generate Palette
      </button>

      <!-- Dropdown with 10 Original Palette Styles -->
      <select class="palette-style-select" id="palette-style" onchange="changePaletteStyle(this.value)">
        <option value="random">🎲 Prism Shuffle</option>
        <option value="analogous">🌈 Color Neighbors</option>
        <option value="monochromatic">🌗 Single Hue Flow</option>
        <option value="complementary">☯️ Opposite Pulse</option>
        <option value="triadic">🔺 Three Point Harmony</option>
        <option value="split">📐 Contrast Split</option>
        <option value="pastel">🌸 Candy Mist</option>
        <option value="vibrant">⚡ Neon Energy</option>
        <option value="moody">🌙 Midnight Ember</option>
        <option value="earthy">🌿 Forest Clay</option>
      </select>

      <div class="secondary-controls-group">
        <button class="btn-secondary" onclick="toggleAllLocks()">
          <svg id="global-lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="global-lock-text">Lock Colors</span>
        </button>

        <!-- Favourite Button -->
        <button class="btn-secondary favorite-btn" onclick="saveFavourite()">
          <span id="favorite-icon">♡</span>
          <span>Favourite</span>
        </button>

        <select class="format-select" id="color-format" onchange="changeColorFormat(this.value)">
          <option value="hex">HEX</option>
          <option value="rgb">RGB</option>
          <option value="hsl">HSL</option>
        </select>
      </div>
    </div>

    <!-- Swatches Grid -->
    <div class="palette-box" id="palette-box"></div>

    <!-- Formatted Footer with Copyright -->
    <div class="footer-note">
      <span>✦ Click any color to copy value</span>

  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    let colors = [
      { hex: '#6A4CFF', name: 'Color 1', locked: false },
      { hex: '#FF3CAC', name: 'Color 2', locked: false },
      { hex: '#FF8A65', name: 'Color 3', locked: false },
      { hex: '#B388FF', name: 'Color 4', locked: false },
      { hex: '#1E1A3A', name: 'Color 5', locked: false }
    ];

    let currentFormat = 'hex';
    let selectedPaletteStyle = 'random';
    let favouritePalettes = JSON.parse(localStorage.getItem('favouritePalettes')) || [];

    const paletteBox = document.getElementById('palette-box');
    const toast = document.getElementById('toast');

    /* Color Helpers & Format Converters */
    function randomRGBColor() {
      const r = Math.floor(Math.random() * 256);
      const g = Math.floor(Math.random() * 256);
      const b = Math.floor(Math.random() * 256);
      return rgbToHex(r, g, b);
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("").toUpperCase();
    }

    function hslToHex(h, s, l) {
      s /= 100;
      l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));

      const r = Math.round(255 * f(0));
      const g = Math.round(255 * f(8));
      const b = Math.round(255 * f(4));

      return rgbToHex(r, g, b);
    }

    function hexToRgb(hex) {
      let r = parseInt(hex.substring(1, 3), 16);
      let g = parseInt(hex.substring(3, 5), 16);
      let b = parseInt(hex.substring(5, 7), 16);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function hexToHsl(hex) {
      let r = parseInt(hex.substring(1, 3), 16) / 255;
      let g = parseInt(hex.substring(3, 5), 16) / 255;
      let b = parseInt(hex.substring(5, 7), 16) / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
    }

    /* Automated Color Naming Function */
    function getColorName(hex) {
      let r = parseInt(hex.substring(1, 3), 16);
      let g = parseInt(hex.substring(3, 5), 16);
      let b = parseInt(hex.substring(5, 7), 16);

      let max = Math.max(r, g, b);
      let min = Math.min(r, g, b);
      let diff = max - min;

      // Black / White / Gray
      if (max < 35) return "Black";
      if (min > 220) return "White";

      if (diff < 20) {
        if (max < 90) return "Dark Gray";
        if (max < 170) return "Gray";
        return "Light Gray";
      }

      let h = 0;

      if (diff !== 0) {
        if (max === r) {
          h = ((g - b) / diff) % 6;
        } else if (max === g) {
          h = (b - r) / diff + 2;
        } else {
          h = (r - g) / diff + 4;
        }

        h = Math.round(h * 60);

        if (h < 0) h += 360;
      }

      const brightness = (r + g + b) / 3;

      if (brightness < 55) {
        if (h >= 200 && h < 280) return "Deep Purple";
        if (h >= 280 && h < 330) return "Deep Violet";
        if (h >= 330 || h < 20) return "Deep Red";
        if (h >= 20 && h < 70) return "Dark Brown";
        if (h >= 70 && h < 170) return "Dark Green";
        if (h >= 170 && h < 250) return "Dark Blue";
      }

      if (h < 15 || h >= 345) return "Red";
      if (h < 45) return "Orange";
      if (h < 70) return "Yellow";
      if (h < 160) return "Green";
      if (h < 200) return "Cyan";
      if (h < 250) return "Blue";
      if (h < 290) return "Purple";
      if (h < 330) return "Pink";
      return "Red";
    }

    /* 10 Palette Style Algorithm Generator */
    function generateStyleColors() {
      const baseHue = Math.floor(Math.random() * 360);

      switch (selectedPaletteStyle) {
        case "random":
          return Array.from({ length: 5 }, () => randomRGBColor());

        case "analogous":
          return [0, 15, 30, 45, 60].map(offset => hslToHex((baseHue + offset) % 360, 65, 55));

        case "monochromatic":
          return [20, 35, 50, 65, 80].map(lightness => hslToHex(baseHue, 60, lightness));

        case "complementary":
          const compHue = (baseHue + 180) % 360;
          return [
            hslToHex(baseHue, 70, 45),
            hslToHex(baseHue, 60, 60),
            hslToHex(baseHue, 40, 75),
            hslToHex(compHue, 65, 50),
            hslToHex(compHue, 75, 40)
          ];

        case "triadic":
          return [
            hslToHex(baseHue, 70, 50),
            hslToHex(baseHue, 50, 65),
            hslToHex((baseHue + 120) % 360, 65, 55),
            hslToHex((baseHue + 240) % 360, 65, 55),
            hslToHex((baseHue + 240) % 360, 45, 70)
          ];

        case "split":
          const split1 = (baseHue + 150) % 360;
          const split2 = (baseHue + 210) % 360;
          return [
            hslToHex(baseHue, 70, 45),
            hslToHex(baseHue, 50, 65),
            hslToHex(split1, 65, 55),
            hslToHex(split2, 65, 55),
            hslToHex(split2, 45, 70)
          ];

        case "pastel":
          return Array.from({ length: 5 }, (_, i) => 
            hslToHex((baseHue + i * 40) % 360, 70, 80)
          );

        case "vibrant":
          return Array.from({ length: 5 }, (_, i) => 
            hslToHex((baseHue + i * 50) % 360, 95, 50)
          );

        case "moody":
          return Array.from({ length: 5 }, (_, i) => 
            hslToHex((baseHue + i * 30) % 360, 40, 20 + i * 5)
          );

        case "earthy":
          const earthHues = [25, 40, 80, 140, 160];
          return earthHues.map(h => hslToHex(h, 35, 35 + Math.random() * 20));

        default:
          return Array.from({ length: 5 }, () => randomRGBColor());
      }
    }

    function getFormattedValue(hex) {
      if (currentFormat === 'rgb') return hexToRgb(hex);
      if (currentFormat === 'hsl') return hexToHsl(hex);
      return hex;
    }

    function renderPalette() {
      paletteBox.innerHTML = '';

      colors.forEach((colorObj, index) => {
        const card = document.createElement('div');
        card.className = `color-card ${index === 4 ? 'full-width-mobile' : ''}`;
        const displayValue = getFormattedValue(colorObj.hex);

        card.innerHTML = `
          <div class="color-display" data-color="${colorObj.hex}" style="background-color: ${colorObj.hex}" onclick="copyToClipboard('${displayValue}')">
            <button class="lock-indicator" onclick="event.stopPropagation(); toggleLock(${index})" title="Lock color">
              ${colorObj.locked ? 
                `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>` : 
                `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`
              }
            </button>
          </div>
          <div class="color-footer">
            <div class="color-info">
              <span class="color-name">${getColorName(colorObj.hex)}</span>
              <span class="hex-text" title="${displayValue}">${displayValue}</span>
            </div>
            <button class="copy-icon-btn" onclick="copyToClipboard('${displayValue}')" title="Copy Color">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        `;

        paletteBox.appendChild(card);
      });

      // Reset heart icon when rendering a new palette
      const favoriteIcon = document.getElementById('favorite-icon');
      const favoriteBtn = document.querySelector('.favorite-btn');
      if (favoriteIcon) favoriteIcon.textContent = '♡';
      if (favoriteBtn) favoriteBtn.classList.remove('saved');
    }

    function generatePalette() {
      const newHexCodes = generateStyleColors();

      colors = colors.map((colorObj, idx) => {
        if (colorObj.locked) return colorObj;
        return {
          hex: newHexCodes[idx],
          name: getColorName(newHexCodes[idx]),
          locked: false
        };
      });

      renderPalette();
    }

    function changePaletteStyle(style) {
      selectedPaletteStyle = style;
      generatePalette();
    }

    function changeColorFormat(format) {
      currentFormat = format;
      renderPalette();
    }

    function toggleLock(index) {
      colors[index].locked = !colors[index].locked;
      renderPalette();
    }

    function toggleAllLocks() {
      const allLocked = colors.every(c => c.locked);
      colors = colors.map(c => ({ ...c, locked: !allLocked }));
      
      document.getElementById('global-lock-text').textContent = !allLocked ? 'Unlock All' : 'Lock Colors';
      renderPalette();
    }

    function saveFavourite() {
      const paletteBox = document.getElementById("palette-box");
      if (!paletteBox) return;

      const cards = paletteBox.querySelectorAll(".color-display");
      if (cards.length !== 5) return;

      const currentColors = Array.from(cards).map(card => card.dataset.color || card.style.backgroundColor);

      const favourite = {
        id: Date.now(),
        style: selectedPaletteStyle,
        colors: currentColors
      };

      favouritePalettes.push(favourite);
      localStorage.setItem("favouritePalettes", JSON.stringify(favouritePalettes));

      const icon = document.getElementById("favorite-icon");
      if (icon) icon.textContent = "♥";

      const button = document.querySelector(".favorite-btn");
      if (button) button.classList.add("saved");

      showToast("♥ Palette saved to favourites!");
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      const iconBtn = document.getElementById('theme-icon');
      if (theme === 'light') {
        iconBtn.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      } else {
        iconBtn.innerHTML = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    function copyToClipboard(value) {
      navigator.clipboard.writeText(value).then(() => {
        showToast(`Copied ${value} to clipboard!`);
      });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.setFillColor(22, 16, 36);
      doc.rect(0, 0, 210, 297, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.text("Aurora Palette Studio - Palette Export", 20, 30);
      
      colors.forEach((color, i) => {
        const y = 50 + (i * 35);
        doc.setFillColor(color.hex);
        doc.roundedRect(20, y, 40, 25, 3, 3, 'F');
        
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(14);
        const name = getColorName(color.hex);
        doc.text(`${name}: ${getFormattedValue(color.hex)}`, 70, y + 16);
      });

      doc.save("Aurora_Palette.pdf");
      showToast("Exported PDF!");
    }

    // Spacebar Key listener to generate new palette
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        generatePalette();
      }
    });

    // Initialize application state on page load
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderPalette();
    });
  </script>
</body>
</html>
